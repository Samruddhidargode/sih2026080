<text x="1300" y="525" text-anchor="start" font-size="13" font-style="italic" fill="#444" paint-order="stroke" stroke="white" stroke-width="5">ŷ</text>
<path d="M1275,592 L1300,592" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M1435,540 L1435,502" fill="none" stroke="#333" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="1445" y="525" text-anchor="start" font-size="13" font-style="italic" fill="#444" paint-order="stroke" stroke="white" stroke-width="5">backprop</text>
