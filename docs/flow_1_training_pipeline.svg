<text x="995" y="452" text-anchor="start" font-size="13" font-style="italic" fill="#444" paint-order="stroke" stroke="white" stroke-width="5">all 6 ch</text>
<path d="M670,564 L690,564 L690,675 L1585,675 L1585,152 L1570,152" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="900" y="670" text-anchor="middle" font-size="13" font-style="italic" fill="#444" paint-order="stroke" stroke="white" stroke-width="5">regime label</text>
<path d="M510,628 L510,695 L1435,695 L1435,645" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
