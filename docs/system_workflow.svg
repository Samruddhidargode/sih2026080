<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1600" height="980" fill="white"/>
<text x="30" y="42" font-size="28" font-weight="700" fill="#222">System workflow (operational, every forecast day)</text>
<text x="30" y="66" font-size="15" fill="#555">Same preprocessing as training, frozen weights. Forecast published immediately; verification runs next day when IMD observations arrive.</text>
<rect x="30" y="100" width="260" height="120" rx="9" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="2.2"/>
<text x="160.0" y="123.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#222">Today's 00Z GFS</text>
<text x="160.0" y="141.0" text-anchor="middle" font-size="11.5" fill="#333">rain, u850, v850, MSLP</text>
<text x="160.0" y="158.5" text-anchor="middle" font-size="11.5" fill="#333">Day-1 / 2 / 3</text>
<text x="160.0" y="176.0" text-anchor="middle" font-size="11.5" fill="#333">same fields as training, fetched live</text>
<rect x="30" y="260" width="260" height="85" rx="9" fill="#EFEFEF" stroke="#666666" stroke-width="2.2"/>
<text x="160.0" y="283.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#222">Daily scheduler</text>
<text x="160.0" y="301.0" text-anchor="middle" font-size="11.5" fill="#333">runs ~06:30 IST, right after</text>
<text x="160.0" y="318.5" text-anchor="middle" font-size="11.5" fill="#333">the 00Z GFS run lands (~05:30)</text>
<rect x="325" y="100" width="320" height="120" rx="9" fill="#EFEFEF" stroke="#666666" stroke-width="2.2"/>
<text x="485.0" y="123.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#222">BOX 1 · preprocessing</text>
<text x="485.0" y="141.0" text-anchor="middle" font-size="11.5" fill="#333">24-h totals, regrid to 129 × 135</text>
<text x="485.0" y="158.5" text-anchor="middle" font-size="11.5" fill="#333">z-score using SAVED training mean/std</text>
<text x="485.0" y="176.0" text-anchor="middle" font-size="11.5" fill="#333">identical code path used at training time</text>
<rect x="325" y="260" width="280" height="85" rx="9" fill="#EFEFEF" stroke="#666666" stroke-width="2.2"/>
<text x="465.0" y="283.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#222">Cached terrain (static)</text>
<text x="465.0" y="301.0" text-anchor="middle" font-size="11.5" fill="#333">elevation + land mask</text>
<text x="465.0" y="318.5" text-anchor="middle" font-size="11.5" fill="#333">computed once, reused every day</text>
<rect x="680" y="100" width="260" height="120" rx="9" fill="#EFEFEF" stroke="#666666" stroke-width="2.2"/>
<text x="810.0" y="123.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#222">Unified tensor</text>
<text x="810.0" y="141.0" text-anchor="middle" font-size="11.5" fill="#333">6 × 129 × 135, one snapshot</text>
<text x="810.0" y="158.5" text-anchor="middle" font-size="11.5" fill="#333">identical layout to training input</text>
<rect x="975" y="100" width="300" height="128" rx="9" fill="#EBDDF5" stroke="#7B3FA0" stroke-width="2.2"/>
<text x="1125.0" y="123.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#222">Regime classifier (frozen)</text>
<text x="1125.0" y="140.5" text-anchor="middle" font-size="11" fill="#333">softmax -&gt; e.g. Depression 0.81</text>
<text x="1125.0" y="157.5" text-anchor="middle" font-size="11" fill="#333">argmax -&gt; regime of the day</text>
<text x="1125.0" y="174.5" text-anchor="middle" font-size="11" fill="#333">weights frozen: no learning happens live</text>
<rect x="1310" y="100" width="260" height="128" rx="9" fill="#EBDDF5" stroke="#7B3FA0" stroke-width="2.2"/>
<text x="1440.0" y="123.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#222">Selected U-Net (frozen)</text>
<text x="1440.0" y="140.5" text-anchor="middle" font-size="11" fill="#333">loads only the 1 of 4 expert</text>
<text x="1440.0" y="157.5" text-anchor="middle" font-size="11" fill="#333">networks that matches the regime</text>
<text x="1440.0" y="174.5" text-anchor="middle" font-size="11" fill="#333">out: rain (mm) + 3 probabilities</text>
<rect x="975" y="280" width="595" height="108" rx="9" fill="#DDF3E0" stroke="#2E8B57" stroke-width="2.2"/>
<text x="1272.5" y="303.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#222">Grid products</text>
<text x="1272.5" y="321.5" text-anchor="middle" font-size="12" fill="#333">corrected 24-h rain (mm) · P(&gt;64.5 / 115.5 / 204.4 mm)</text>
<text x="1272.5" y="339.5" text-anchor="middle" font-size="12" fill="#333">129 × 135 maps, same grid as the raw input</text>
<rect x="645" y="415" width="300" height="100" rx="9" fill="#EFEFEF" stroke="#666666" stroke-width="2.2"/>
<text x="795.0" y="438.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#222">District aggregation</text>
<text x="795.0" y="455.0" text-anchor="middle" font-size="10.5" fill="#333">area-weighted overlay: grid -&gt; 676 districts</text>
<text x="795.0" y="471.5" text-anchor="middle" font-size="10.5" fill="#333">mean = advisory value, max = flood-risk flag</text>
<text x="795.0" y="488.0" text-anchor="middle" font-size="10.5" fill="#333">alert colour set from the probability</text>
<rect x="975" y="415" width="595" height="100" rx="9" fill="#DDF3E0" stroke="#2E8B57" stroke-width="2.2"/>
<text x="1272.5" y="438.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#222">Dashboard (Streamlit + Folium)</text>
<text x="1272.5" y="455.5" text-anchor="middle" font-size="11" fill="#333">date &amp; lead picker · Raw / Corrected / Observed toggle</text>
<text x="1272.5" y="472.5" text-anchor="middle" font-size="11" fill="#333">district map &amp; table · regime badge · metrics scoreboard</text>
<text x="1272.5" y="489.5" text-anchor="middle" font-size="11" fill="#333">reads precomputed files only - no model runs live</text>
<rect x="30" y="620" width="280" height="95" rx="9" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="2.2"/>
<text x="170.0" y="643.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#222">IMD observations</text>
<text x="170.0" y="661.0" text-anchor="middle" font-size="11.5" fill="#333">ground truth for the same day</text>
<text x="170.0" y="678.5" text-anchor="middle" font-size="11.5" fill="#333">arrives ~24 h after the forecast</text>
<rect x="645" y="590" width="460" height="140" rx="9" fill="#FDE3CC" stroke="#D2691E" stroke-width="2.2"/>
<text x="875.0" y="613.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#222">Verification engine (next day)</text>
<text x="875.0" y="630.5" text-anchor="middle" font-size="11" fill="#333">Raw vs Corrected vs IMD, at 64.5/115.5/204.4 mm</text>
<text x="875.0" y="647.5" text-anchor="middle" font-size="11" fill="#333">RMSE, ETS, CSI, POD, FAR (xskillscore)</text>
<text x="875.0" y="664.5" text-anchor="middle" font-size="11" fill="#333">+ FSS (neighbourhood skill, custom)</text>
<text x="875.0" y="681.5" text-anchor="middle" font-size="11" fill="#333">grouped by regime and by lead time</text>
<rect x="1160" y="590" width="410" height="140" rx="9" fill="#DDF3E0" stroke="#2E8B57" stroke-width="2.2"/>
<text x="1365.0" y="613.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#222">Verification products</text>
<text x="1365.0" y="631.0" text-anchor="middle" font-size="11.5" fill="#333">comparison table: raw vs corrected</text>
<text x="1365.0" y="648.5" text-anchor="middle" font-size="11.5" fill="#333">auto-generated report (HTML/PDF)</text>
<text x="1365.0" y="666.0" text-anchor="middle" font-size="11.5" fill="#333">feeds the dashboard's scoreboard</text>
<path d="M290,160 L325,160" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M605,160 L680,160" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M605,302 L630,302 L630,200 L680,200" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M940,160 L975,160" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="957" y="92" text-anchor="middle" font-size="13" font-style="italic" fill="#444" paint-order="stroke" stroke="white" stroke-width="5">wind + pressure</text>
<path d="M940,175 L960,175 L960,215 L975,215" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="965" y="245" text-anchor="start" font-size="13" font-style="italic" fill="#444" paint-order="stroke" stroke="white" stroke-width="5">all 6 channels</text>
<path d="M1275,160 L1310,160" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="1292.5" y="153.0" text-anchor="middle" font-size="13" font-style="italic" fill="#444" paint-order="stroke" stroke="white" stroke-width="5">regime</text>
<path d="M1440,228 L1440,280 L1272,280" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M1272,388 L945,465" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="1100" y="440" text-anchor="middle" font-size="13" font-style="italic" fill="#444" paint-order="stroke" stroke="white" stroke-width="5">grid -&gt; district</text>
<path d="M795,515 L795,555 L1120,555 L1120,415" fill="none" stroke="#333" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="1000" y="548" text-anchor="start" font-size="13" font-style="italic" fill="#444" paint-order="stroke" stroke="white" stroke-width="5">regime badge</text>
<path d="M1272,388 L1272,415" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M310,667 L645,667" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="477.5" y="660.0" text-anchor="middle" font-size="13" font-style="italic" fill="#444" paint-order="stroke" stroke="white" stroke-width="5">ground truth</text>
<path d="M170,355 L170,585 L645,660" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="300" y="500" text-anchor="start" font-size="13" font-style="italic" fill="#444" paint-order="stroke" stroke="white" stroke-width="5">raw NWP (baseline for comparison)</text>
<path d="M1272,515 L1130,590" fill="none" stroke="#333" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="1150" y="555" text-anchor="middle" font-size="13" font-style="italic" fill="#444" paint-order="stroke" stroke="white" stroke-width="5">corrected forecast</text>
<path d="M1105,590 L1160,660" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M1365,590 L1365,555 L1272,505" fill="none" stroke="#333" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="1330" y="545" text-anchor="start" font-size="13" font-style="italic" fill="#444" paint-order="stroke" stroke="white" stroke-width="5">scoreboard update</text>
<rect x="30" y="890" width="20" height="14" rx="3" fill="#DCEBFA" stroke="#2F6DB5" stroke-width="2"/>
<text x="57" y="902" font-size="14" fill="#444">input</text>
<rect x="220" y="890" width="20" height="14" rx="3" fill="#EFEFEF" stroke="#666666" stroke-width="2"/>
<text x="247" y="902" font-size="14" fill="#444">processing</text>
<rect x="410" y="890" width="20" height="14" rx="3" fill="#EBDDF5" stroke="#7B3FA0" stroke-width="2"/>
<text x="437" y="902" font-size="14" fill="#444">frozen model</text>
<rect x="600" y="890" width="20" height="14" rx="3" fill="#DDF3E0" stroke="#2E8B57" stroke-width="2"/>
<text x="627" y="902" font-size="14" fill="#444">deliverable</text>
