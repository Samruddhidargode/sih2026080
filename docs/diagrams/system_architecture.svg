    <text x="1114" y="438" font-size="15" font-weight="700">Correction experts <tspan font-size="11" font-weight="600" fill="#6A3FA0">(GPU)</tspan></text>
    <text x="1114" y="460" font-size="12.5">E0 QM · E1 regime QM · E2 ML · E3 U-Net</text>

    <text x="1114" y="550" font-size="15" font-weight="700">Blend, calibrate &amp; check</text>
    <text x="1114" y="572" font-size="12.5">regime weights · sanity rules · districts</text>
