    <text x="468" y="230" font-size="15" font-weight="700">Orchestrator</text>
    <text x="468" y="252" font-size="12.5">ecFlow / Airflow</text>
    <text x="468" y="270" font-size="12.5">starts on model-run arrival</text>

    <text x="468" y="384" font-size="15" font-weight="700">Data fetchers</text>
    <text x="468" y="406" font-size="12.5">FTP / API download</text>
    <text x="468" y="424" font-size="12.5">checksums · retries</text>

    <text x="468" y="538" font-size="15" font-weight="700">Input validation</text>
    <text x="468" y="560" font-size="12.5">completeness · value ranges</text>
    <text x="468" y="578" font-size="12.5">NWP version check</text>
  </g>
