  <!-- ================= FOOTER ================= -->
  <rect x="30" y="982" width="1860" height="72" rx="10" fill="#F3F5F7"/>
  <text x="48" y="1011" font-size="15" fill="#1A1A1A"><tspan font-weight="700">Principles: </tspan>on-premise at IMD / NCMRWF · same code in training and operations · fallback at every layer · every forecast traceable to its model version</text>
  <text x="48" y="1037" font-size="13" fill="#555555">Indicative hardware: 2 CPU inference nodes + 1–2 GPUs · tens of TB storage, backed up in two locations · fully open-source software stack</text>

