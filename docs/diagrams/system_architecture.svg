  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

  <!-- ================= TITLE ================= -->
  <text x="960" y="56" text-anchor="middle" font-size="30" font-weight="700" fill="#1A1A1A">System Architecture — Regime-Aware Rainfall Post-Processing</text>
  <text x="960" y="90" text-anchor="middle" font-size="17" fill="#555555">What the system is built from and how the parts connect (deployed on-premise at IMD / NCMRWF)</text>

