  </g>
  <g text-anchor="middle" fill="#263238">
    <text x="160" y="218" font-size="15" font-weight="700">NWP model output</text>
    <text x="160" y="240" font-size="12.5">IMD GFS · NCMRWF NCUM, NEPS</text>
    <text x="160" y="258" font-size="12.5">GRIB2 · 00 &amp; 12 UTC</text>

    <text x="160" y="342" font-size="15" font-weight="700">Rain gauges</text>
    <text x="160" y="364" font-size="12.5">AWS · ARG · district rainfall</text>
    <text x="160" y="382" font-size="12.5">real-time feed</text>

    <text x="160" y="466" font-size="15" font-weight="700">IMD gridded rainfall</text>
    <text x="160" y="488" font-size="12.5">0.25° daily</text>
    <text x="160" y="506" font-size="12.5">real-time &amp; final versions</text>

    <text x="160" y="590" font-size="15" font-weight="700">Satellite &amp; radar</text>
    <text x="160" y="612" font-size="12.5">GPM IMERG · INSAT-3D</text>
    <text x="160" y="630" font-size="12.5">Doppler radar rainfall</text>

    <text x="160" y="714" font-size="15" font-weight="700">Reference data</text>
    <text x="160" y="736" font-size="12.5">terrain · coast · districts</text>
    <text x="160" y="754" font-size="12.5">cyclone / low tracks</text>
  </g>

