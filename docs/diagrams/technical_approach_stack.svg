  <!-- ================= FOOTER ================= -->
  <rect x="30" y="958" width="1860" height="80" rx="10" fill="#F3F5F7"/>
  <text x="960" y="990" text-anchor="middle" font-size="15.5" fill="#1A1A1A"><tspan font-weight="700">Deployment: </tspan>on-premise at IMD / NCMRWF · Docker containers · CPU nodes for daily runs + 1–2 NVIDIA GPUs for the U-Net · fully open-source stack</text>
  <text x="960" y="1018" text-anchor="middle" font-size="13.5" fill="#555555">Goal: better district-level heavy-rain forecasts than raw NWP and a single bias-correction method, proven on held-out years with RMSE, ETS, CSI, POD, FAR and FSS</text>
</svg>
