  <!-- card titles -->
  <g font-size="17" font-weight="700">
    <text x="56" y="578" fill="#1F5FAD">Data handling</text>
    <text x="684" y="578" fill="#6A3FA0">Machine learning</text>
    <text x="1312" y="578" fill="#0F7C7C">Meteorology &amp; verification</text>
