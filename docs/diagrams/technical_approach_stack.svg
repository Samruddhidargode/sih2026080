  <!-- why lines -->
  <g font-size="13" font-style="italic" fill="#455A64">
    <text x="56" y="716"><tspan font-weight="700">Why: </tspan>standard formats IMD / NCMRWF already use (GRIB2, NetCDF)</text>
    <text x="684" y="716"><tspan font-weight="700">Why: </tspan>LightGBM for limited seasons of data; CNN only where spatial patterns matter</text>
    <text x="1312" y="716"><tspan font-weight="700">Why: </tspan>established, peer-reviewed tools that IMD scientists already trust</text>
    <text x="56" y="923"><tspan font-weight="700">Why: </tspan>every forecast traceable to its exact data and model version</text>
    <text x="684" y="923"><tspan font-weight="700">Why: </tspan>runs unattended every day; ecFlow is standard at weather centres</text>
    <text x="1312" y="923"><tspan font-weight="700">Why: </tspan>forecasters review before issue; operators alerted on any failure</text>
