    <text x="118" y="172">IMD HQ, regional &amp; state</text><text x="118" y="188">meteorological centres</text>
    <text x="588" y="172">NDMA · SDMAs · district</text><text x="588" y="188">collectors · NDRF</text>
    <text x="1058" y="172">farmers (agromet) · CWC &amp; dams</text><text x="1058" y="188">cities · railways · power</text>
    <text x="1528" y="172">people in flood- and</text><text x="1528" y="188">landslide-prone districts</text>
  </g>

