  <g font-size="11" font-weight="700" letter-spacing="1.2" fill="#C62828">
    <text x="62" y="223">GAP TODAY</text><text x="532" y="223">GAP TODAY</text><text x="1002" y="223">GAP TODAY</text><text x="1472" y="223">GAP TODAY</text>
  </g>
  <g font-size="14" fill="#7F1D1D">
    <text x="62" y="244">Raw model rain is biased, and one</text><text x="62" y="262">correction is used for every kind</text><text x="62" y="280">of weather</text>
    <text x="532" y="244">Heavy rain under-forecast or placed</text><text x="532" y="262">in the wrong district, with no</text><text x="532" y="280">confidence level</text>
    <text x="1002" y="244">Model output is a grid, hard to act</text><text x="1002" y="262">on at district and village level</text>
    <text x="1472" y="244">Missed warnings and false alarms</text><text x="1472" y="262">erode trust in forecasts</text>
  </g>

  <!-- arrows down -->
  <g>
    <polygon points="245,296 265,296 265,306 275,306 255,318 235,306 245,306" fill="#1F5FAD"/>
    <polygon points="715,296 735,296 735,306 745,306 725,318 705,306 715,306" fill="#6A3FA0"/>
    <polygon points="1185,296 1205,296 1205,306 1215,306 1195,318 1175,306 1185,306" fill="#2E7D32"/>
    <polygon points="1655,296 1675,296 1675,306 1685,306 1665,318 1645,306 1655,306" fill="#E08E0B"/>
