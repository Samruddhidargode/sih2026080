  <text x="920" y="530" font-size="15" font-weight="700" letter-spacing="1.2" fill="#FFFFFF">ECONOMIC BENEFITS</text>
  <path d="M1400,534 C1400,520 1410,515 1420,514 C1420,526 1414,533 1400,534 Z" fill="#FFFFFF"/>
  <line x1="1400" y1="534" x2="1412" y2="522" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="1432" y="530" font-size="15" font-weight="700" letter-spacing="1.2" fill="#FFFFFF">ENVIRONMENTAL BENEFITS</text>

  <!-- feature names -->
  <g font-size="15.5" font-weight="700" fill="#263238">
    <text x="50" y="583">Regime-aware correction</text>
    <text x="50" y="645">Rain in the right place (U-Net)</text>
    <text x="50" y="707">Heavy-rain probabilities</text>
    <text x="50" y="769">District warning colours</text>
    <text x="50" y="831">Explainable &amp; verified daily</text>
    <text x="50" y="893">Lightweight &amp; self-improving</text>
  </g>

  <!-- cells -->
  <g font-size="14.5" fill="#333333">
    <text x="380" y="583"><tspan font-weight="700" fill="#123A6B">More reliable warnings</tspan>, more public trust</text>
    <text x="380" y="645"><tspan font-weight="700" fill="#123A6B">The right districts</tspan> get warned</text>
    <text x="380" y="707"><tspan font-weight="700" fill="#123A6B">Earlier evacuations</tspan>, lives saved</text>
    <text x="380" y="769"><tspan font-weight="700" fill="#123A6B">Easy to act on</tspan> for officials and the public</text>
    <text x="380" y="831"><tspan font-weight="700" fill="#123A6B">Accountability</tspan> and trust in warnings</text>
    <text x="380" y="893"><tspan font-weight="700" fill="#123A6B">Lasting benefit</tspan>, not a one-off study</text>

    <text x="890" y="583"><tspan font-weight="700" fill="#8A5300">Fewer wasted</tspan> emergency mobilisations</text>
    <text x="890" y="645"><tspan font-weight="700" fill="#8A5300">Rescue teams &amp; resources</tspan> sent where needed</text>
    <text x="890" y="707"><tspan font-weight="700" fill="#8A5300">Risk-based decisions</tspan>: reservoirs, insurance, logistics</text>
    <text x="890" y="769"><tspan font-weight="700" fill="#8A5300">Farmers protect crops</tspan> &amp; inputs before heavy rain</text>
    <text x="890" y="831"><tspan font-weight="700" fill="#8A5300">Measurable return</tspan> on forecast investment</text>
    <text x="890" y="893"><tspan font-weight="700" fill="#8A5300">Low cost</tspan>: open-source on existing hardware</text>

    <text x="1400" y="583"><tspan font-weight="700" fill="#1B4D1E">Better water-resource</tspan> planning</text>
    <text x="1400" y="645"><tspan font-weight="700" fill="#1B4D1E">Targeted action</tspan> in fragile hills (landslides, erosion)</text>
    <text x="1400" y="707"><tspan font-weight="700" fill="#1B4D1E">Planned dam releases</tspan> cut downstream flood damage</text>
    <text x="1400" y="769"><tspan font-weight="700" fill="#1B4D1E">Less fertiliser &amp; pesticide</tspan> washed into rivers</text>
    <text x="1400" y="831"><tspan font-weight="700" fill="#1B4D1E">Long-term record</tspan> of changing rain extremes</text>
    <text x="1400" y="893"><tspan font-weight="700" fill="#1B4D1E">Small compute</tspan> &amp; energy footprint</text>
  </g>

  <!-- ============ C. WHY IT MATTERS ============ -->
  <rect x="30" y="934" width="1860" height="118" rx="12" fill="#1B3A57"/>
  <text x="62" y="962" font-size="12.5" font-weight="700" letter-spacing="2" fill="#FFB74D">WHY IT MATTERS</text>
  <text x="62" y="1026" font-size="56" font-weight="800" fill="#FFB74D">~3×</text>
  <text x="200" y="996" font-size="17" font-weight="700" fill="#FFFFFF">rise in widespread extreme-rain events</text>
  <text x="200" y="1018" font-size="17" font-weight="700" fill="#FFFFFF">over central India since 1950</text>
  <text x="200" y="1040" font-size="12.5" fill="#B0C4D8">Roxy et al., Nature Communications (2017)</text>
  <line x1="880" y1="954" x2="880" y2="1032" stroke="#3E5C78" stroke-width="2"/>
  <text x="920" y="980" font-size="16" fill="#DCE6F0">Kerala floods (2018) · Wayanad landslides (2024)</text>
  <text x="920" y="1008" font-size="19" font-weight="700" fill="#FFB74D">The costliest forecast errors are in heavy rain,</text>
  <text x="920" y="1034" font-size="19" font-weight="700" fill="#FFFFFF">exactly where our system focuses.</text>
</svg>
