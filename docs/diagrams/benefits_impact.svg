  <rect x="1456" y="324" width="418" height="126" rx="8" fill="#FFF4E0"/>
  <g font-size="11" font-weight="700" letter-spacing="1.2">
    <text x="62" y="344" fill="#1F5FAD">HOW WE FILL IT</text>
    <text x="532" y="344" fill="#6A3FA0">HOW WE FILL IT</text>
    <text x="1002" y="344" fill="#2E7D32">HOW WE FILL IT</text>
    <text x="1472" y="344" fill="#B26A00">HOW WE FILL IT</text>
  </g>
  <g font-size="15.5" font-weight="600">
    <text x="62" y="370" fill="#123A6B">Regime-aware correction, with the</text>
    <text x="62" y="391" fill="#123A6B">reasons shown for every forecast</text>
    <text x="532" y="370" fill="#3E2463">Rain moved to the right place +</text>
    <text x="532" y="391" fill="#3E2463">calibrated heavy-rain probability</text>
    <text x="532" y="412" fill="#3E2463">for every district</text>
    <text x="1002" y="370" fill="#1B4D1E">District tables &amp; warning colours</text>
    <text x="1002" y="391" fill="#1B4D1E">for Days 1 to 5, ready to use</text>
    <text x="1472" y="370" fill="#6B4200">Fewer missed events, fewer false</text>
    <text x="1472" y="391" fill="#6B4200">alarms, verified every day</text>
  </g>
  <g>
    <rect x="1002" y="424" width="26" height="12" rx="2" fill="#43A047"/>
    <rect x="1032" y="424" width="26" height="12" rx="2" fill="#F2C200"/>
